# Triage ET Open du kit OREOA-AI - categories exclues du ruleset bake
# Objectif : eliminer le bruit structurel en analyse DFIR offline.
# Principe : recall sur les familles a haute valeur (malware, C2, trojan, exploit,
# compromised, dns, phishing), precision sur le reste. Chaque exclusion est
# justifiee ; retrait possible ligne par ligne si un besoin d'affaire l'exige.

# Categories politiques et inventaires - tres bruyantes, aucune valeur d'investigation
emerging-policy.rules
emerging-user_agents.rules
emerging-info.rules

# Scans - mieux couverts par les statistiques tshark et le signal SF-R-006
emerging-scan.rules

# Divers
emerging-deleted.rules

# Evenements de protocole (anomalies decoder/stream/app-layer) - volumineux,
# redondants avec l'analyse tshark ; les signatures utiles restent actives
decoder-events.rules
stream-events.rules
app-layer-events.rules
files.rules
http-events.rules
smtp-events.rules
dns-events.rules
tls-events.rules
