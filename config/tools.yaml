# OREOA-AI kit tools configuration - oreoa-ai-tools containerized image
# Every tool is pinned in the container; the host installs nothing.

# Default kit language: deliverables and case journal follow this language
# (agent conversation mirrors the analyst's language; change per case or with /lang)
language: en

image:
  name: oreoa-ai-tools
  tag: "1.1.0"
  dockerfile: Dockerfile

# Provisioning autonome (doctor.py fix)
provisioning:
  bundle: "tools/oreoa-ai-tools-1.1.0.tar.gz"   # docker save (air-gap), hors depot
  seuil_espace_build_go: 3    # barriere dure : espace libre requis avant docker build
  seuil_espace_load_go: 2     # barriere dure : espace libre requis avant docker load

# Outils pinnes - "test" = verification fonctionnelle (doctor.py test)
outils:
  plaso:
    binaire: log2timeline
    test: "--version"
    role: super-timeline des collections
    version_pinnee: "20260720"
  psort:
    binaire: psort
    test: "--version"
    role: rendu de timeline depuis un fichier plaso
    version_pinnee: "20260720"
  volatility3:
    binaire: vol
    test_cmd: "python3 -c 'from importlib.metadata import version; print(version(\"volatility3\"))'"
    role: analyse memoire volatile
    version_pinnee: "2.28.0"
    licence: "Volatility Software License v1.0 (copyleft - voir NOTICE)"
  fls:
    binaire: fls
    test: "-V"
    role: enumeration systeme de fichiers (The Sleuth Kit)
    version_pinnee: "4.12.1"
  icat:
    binaire: icat
    test: "-V"
    role: extraction de fichier depuis image (The Sleuth Kit)
    version_pinnee: "4.12.1"
  tshark:
    binaire: tshark
    test: "-v"
    role: lecture, filtrage et extraction sur captures reseau
    version_pinnee: "4.4.18"
  suricata:
    binaire: suricata
    test: "-V"
    role: detection par signatures (ET Open + regles kit) et journaux de protocoles sur capture offline (-r)
    version_pinnee: "7.0.10"
  yara:
    binaire: yara
    test: "--version"
    role: scan de fichiers par signatures
    version_pinnee: "4.5.2"

# Bibliotheques Python sans binaire - verification par import (noms de modules reels)
imports:
  regipy: "parsing des ruches de registre Windows (6.3.0)"
  evtx: "parsing des journaux evenements Windows, bindings omerbenamram (0.12.1)"
  Evtx: "parsing alternatif des journaux evtx, williballenthin (0.8.1)"
  artifacts: "lecture des definitions d'artefacts ForensicArtifacts (version au build)"

# Referentiels amont telecharges et bakes dans l'image a chaque build (doctor fix)
referentiels:
  mode: build                # telechargement au build, aucune reference a l'execution
  chemin_image: /referentiels
  traces_image: /referentiels/traces
  vieillissement_jours: 30   # doctor check alerte au-dela de ce seuil d'age
  sources:
    artifacts: "https://github.com/ForensicArtifacts/artifacts (release la plus recente au build)"
    dfiq: "https://github.com/google/dfiq (branche main au build)"
  customs:
    chemin_depot: referentiels-kit   # espaces kit-custom, montes en ro par dt

regles:
  source: catalogue/  # catalogues de signaux faibles
  version_min: "2.0"

limits_execution:
  reseau: none          # aucun reseau dans les conteneurs d'outils
  evidence_mount: ro    # evidence toujours montee lecture seule
  root_requis: false
