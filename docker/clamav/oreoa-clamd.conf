# OREOA-AI clamd service config (docker_build_spec.md 3.3).
# One process per container; the signature db is mounted read-only from
# knowledge/upstream/clamav_db (refreshed only by make update-knowledge);
# workers reach clamd over TCP 3310 on the internal network and stream files
# with clamdscan --stream / pyclamd. The container runs read-only as
# uid 10001: only /tmp (tmpfs) is writable.
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
PidFile /tmp/clamd.pid
# clamd (1.5.4) refuses /dev/stdout and bare 'stderr'; the log lands in the
# writable tmpfs - container logging stays for the entrypoint errors.
LogFile /tmp/clamd.log
LogTime yes
LogRotate no
LogSyslog no
TCPSocket 3310
TCPAddr 0.0.0.0
MaxConnectionQueueLength 30
MaxThreads 12
ReadTimeout 300
# Archive-bomb defense (complements the worker sandbox):
MaxScanSize 512M
MaxFileSize 256M
MaxRecursion 16
MaxFiles 10000
StreamMaxLength 256M
DetectPUA no
