# hunts/catalog.yaml — seed catalogue (headers only, SQL to be written per hunt)
#
# Conventions
# - id            : H-<AREA>-<nnn>. Areas: IA initial access, EX execution, PE persistence,
#                   PR privilege & accounts, LM lateral movement, DC discovery & collection,
#                   EF exfiltration, C2 command & control, AF anti-forensics, TL timeline helpers,
#                   LX linux-specific, MC macos-specific.
# - tables        : normalized families read (see normalized_data_model.md).
# - os            : subset of [windows, linux, macos, android]. "all" = every OS.
# - params        : every hunt accepts {host} (nullable = all hosts), {start}, {end} (UTC, nullable);
#                   only additional params are listed.
# - dfiq          : DFIQ question ids. Q1xxx = official (google/dfiq, dfiq/data/questions), Q0xxx = internal
#                   questions defined in knowledge/custom/dfiq/ (DFIQ convention: '0' in 2nd position = internal).
#                   Timeline helpers (H-TL-*) carry none by design.
# - attack        : ATT&CK technique ids.
# - level         : default severity written into `detections`.
# - test          : expected result on the synthetic archive; a hunt without a passing test is not shipped.
#                   Hunts marked os: all MUST have one test per OS (windows, linux, macos); a single test
#                   is not accepted. Path/name lists used by 'all' hunts are parameters per OS, never hard-coded.
# - Every hunt writes to `detections` with engine='hunt', rule_id=<id>, matched_record_ids populated.
 
version: 0.3
 
hunts:
 
# ---------------------------------------------------------------- Initial access
- id: H-IA-001
  title: Office document opened followed by suspicious child process
  description: "Office MRU / recent docs entry followed within {window_min} by an execution whose parent is an Office binary."
  tables: [user_activity, executions, log_events]
  os: [windows, macos]
  params: {window_min: 10}
  attack: [T1566.001, T1204.002]
  dfiq: [Q0001, Q1014]
  level: high
  test: "docm opened at T, powershell child at T+23s → 1 detection"
 
- id: H-IA-002
  title: Browser download followed by first execution
  description: "Download record (browser) with target path matching a later first execution (prefetch/amcache/quarantine/audit) within {window_min}."
