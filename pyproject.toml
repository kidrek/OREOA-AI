[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oreoa"
version = "2.0.0a0"
description = "OREOA-AI containerized DFIR agent platform (v2)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
oreoa = "oreoa.cli:console_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
