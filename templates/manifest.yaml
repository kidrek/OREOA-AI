# Template manifest.yaml - case collection inventory (schema EN, kit contract)

case:
  id: "CASE-2026-0000"
  name: "Case name"
  created: "2026-01-01"
  status: open
  language: en            # language of deliverables and journal (en | fr)

# Analyst-provided incident context - filled at case opening via /case (or /analyse).
# Feeds triage (case type, hypotheses) and the "Case background" report section.
# Left empty if no context provided (journalized in journal.md).
context:
  description: ""
  reported_by: ""
  reported_at: ""
  systems: []
  suspected_period: { start: "", end: "" }
  actions_taken: []
  constraints: []

# Upstream referentials in use - filled automatically by scripts/referentiels.py
# (artifact matching at ingestion). Versions baked into the image at build time.
# referentials:
#   artifacts: { source: "...", version: "...", built_at: "..." }
#   dfiq: { source: "...", commit: "...", built_at: "..." }

collections: []
# Every collection ingested by scripts/ingest.py is recorded here:
#
# - name: "Security.evtx"
#   type: ".evtx"
#   original_path: "/path/to/Security.evtx"       # or "analyst deposit - <declared source>"
#   copy: "00_evidence/originals/Security.evtx"
#   sha256: "<hash>"
#   imported_at: "2026-01-01T00:00:00"
#   description: "Web server Security event log"
#   artifacts: ["WindowsEventLogs"]               # automatic matching (baked referential)
#
# Disk-image collections (v2.0) carry additional fields:
#
# - name: "disk.E01"
#   type: ".e01"                                  # .raw with disk magic -> ".rawdisk"
#   size_bytes: 107374182400                      # image size (disk-space barrier: 3x)
#   notes: ""                                     # out-of-scope notes (e.g. AFF4 gap)
